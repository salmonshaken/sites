<?xml version="1.0" encoding="UTF-8"?>
<!-- スイスイ漢字道場 アプリアイコン

     ・地色はアプリののれんと同じ藍。
     ・「字」は Yuji Syuku（Kinuta Font Factory, SIL Open Font License 1.1）で組んだ字を
       アウトライン化したもの。フォントファイル自体は同梱しておらず、
       ここにあるのは書体を使って作った図案（アウトライン）である。
       SIL OFL はフォントで作成した図案の利用を認めており、図案自体は OFL に拘束されない。
     ・以前は筆順データ（AnimCJK / Arphic Public License）の字形を使っていたが、
       APL はコピーレフトで、アイコンは「配布物」に当たるため差し替えた。
     ・右下の朱は落款印。書の作品に押す印と同じ位置に置いている。
       線ではなく四角にしてあるのは、字の一画や取り消し線と読み違えられないようにするため。
     ・角丸はつけない。iOS が squircle に、Android がマスク形状に自動で丸めるため。
-->
