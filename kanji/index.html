<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>スイスイ漢字道場</title>

    <!-- ホーム画面アイコン（iOS / Android 共通の元絵は icons/icon.svg） -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="manifest" href="manifest.json">

    <!-- ホーム画面から起動したときに Safari のUIを出さない -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="漢字道場">
    <meta name="theme-color" content="#5f3d1d">
    <!-- 外部ライブラリ（Hanzi Writer: MIT / canvas-confetti: ISC）。
         以前はCDNから読み込んでいたが、実行時にコードを落とす形をやめて同梱にした。 -->
    <script src="assets/vendor/hanzi-writer.min.js"></script>
    <script src="assets/vendor/confetti.browser.min.js"></script>

    <!-- 読みもの（よくあるしつもん・クレジット・プライバシー）の本文。
         アプリの動きに関係しない文章だけを分けてある。 -->
    <script src="content.js"></script>

    <!-- 1026字ぶんの音訓。以前は1字表示するたびに kanjiapi.dev へ問い合わせていた。
         build/fetch-readings.py で作り直せる。 -->
    <script src="assets/readings.js"></script>
    <!-- 同梱フォント（SIL OFL 1.1）。Google Fonts からの読み込みをやめ、
         このアプリで使う文字だけに絞ったものを assets/fonts/ に置いてある。 -->
    <link rel="stylesheet" href="assets/fonts.css">
    <style>
        :root {
            --card: 400px;

            /* ---- 道場パレット ---- */
            --washi:      #fdf6e6;  /* 和紙 */
            --washi-deep: #f3e7cd;
            --sumi:       #241f1b;  /* 墨 */
            --sumi-soft:  #5b5147;
            --shu:        #cf3a2e;  /* 朱 */
            --shu-deep:   #a52a20;
            --ai:         #22406e;  /* 藍 */
            --ai-deep:    #16294a;
            --kin:        #d4a017;  /* 金 */
            --wood:       #8b5a2b;
            --wood-deep:  #5f3d1d;
            --wood-light: #b6803f;
            --tatami:     #8fa05e;

            --font-brush:  'Yuji Syuku', 'Klee One', serif;
            --font-ui:     'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
            --font-impact: 'Dela Gothic One', 'Zen Maru Gothic', sans-serif;
        }

        html, body { height: 100%; }

        body {
            font-family: var(--font-ui);
            color: var(--sumi);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;

            /* 和紙＋市松のかすかな地紋 */
            background-color: var(--washi);
            background-image:
                repeating-linear-gradient(45deg, rgba(139,90,43,.028) 0 22px, transparent 22px 44px),
                repeating-linear-gradient(-45deg, rgba(139,90,43,.028) 0 22px, transparent 22px 44px);
        }

        .kanji-font {
            font-family: 'UD Digi Kyokasho N-R', 'UD Digi Kyokasho', 'Yu Kyokasho', 'YuKyokasho', 'Klee One', cursive;
        }
        .brush { font-family: var(--font-brush); font-weight: 400; }
        .impact { font-family: var(--font-impact); font-weight: 400; }

        /* ---- 木の質感 ---- */
        /* 白文字を載せるので、明るいほうの色でも 4.5:1 を満たす濃さにしてある */
        .wood {
            background-image:
                repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 11px),
                linear-gradient(180deg, #96652f, #6b4423);
        }
        .wood-dark {
            background-image:
                repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 2px, transparent 2px 9px),
                linear-gradient(180deg, var(--wood), var(--wood-deep));
        }

        /* ---- 画面（ビュー）切り替え ---- */
        .view { display: none; position: absolute; inset: 0; flex-direction: column; }
        .view.active { display: flex; }

        .scroll-y {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            overscroll-behavior: contain;
        }

        /* =========================================================
         *  ホーム：のれん・提灯
         * ========================================================= */
        .beam { height: 14px; }

        .noren { position: relative; }

        /* 二段のれん。上段は生成りの日除け幕に墨字で「スイスイ」。
           藍地の4枚に対して明るい帯が入ることで「抜け」ができ、
           下段は4枚均等のままなので、のれんとしてのリズムが崩れない。 */
        .noren-title { display: block; margin: 0; }
        .noren-valance {
            display: flex; align-items: center; justify-content: center;
            width: calc(4 * 4.6rem + 3 * 3px);
            height: 2.8rem;
            margin: -2px auto .25rem;
            background: linear-gradient(180deg, #fdf6e6, #efe3c8);
            color: var(--sumi);
            font-family: var(--font-brush);
            font-size: 1.7rem;
            letter-spacing: .42em;
            text-indent: .42em;   /* letter-spacing のぶん右に寄るのを打ち消す */
            -webkit-text-stroke: 1.8px currentColor;
            paint-order: stroke fill;
            box-shadow: inset 0 -10px 14px rgba(139,90,43,.18), 0 3px 6px rgba(0,0,0,.25);
        }
        .noren-pole {
            height: 14px; border-radius: 7px;
            width: calc(4 * 4.6rem + 3 * 3px + 2.5rem);
            max-width: 96%;
            margin: 0 auto 0;
            box-shadow: 0 3px 6px rgba(0,0,0,.35);
        }
        .noren-panels { display: flex; gap: 3px; justify-content: center; margin-top: -2px; }
        .noren-panels span {
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: .55rem;
            width: 4.6rem; height: 5.4rem;
            background: linear-gradient(180deg, var(--ai), var(--ai-deep));
            color: var(--washi);
            font-family: var(--font-brush);
            font-size: 2.7rem;
            box-shadow: inset 0 -20px 24px rgba(0,0,0,.3), 0 4px 8px rgba(0,0,0,.25);
            text-shadow: 0 2px 3px rgba(0,0,0,.45);
        }
        @media (max-width: 420px) {
            .noren-panels span { width: 3.4rem; height: 4.2rem; font-size: 2rem; }
            .noren-valance { width: calc(4 * 3.4rem + 3 * 3px); height: 2.2rem; font-size: 1.3rem; -webkit-text-stroke: 1.4px currentColor; }
            .noren-pole { width: calc(4 * 3.4rem + 3 * 3px + 2rem); }
        }

        .lantern { position: absolute; top: 6px; width: 46px; animation: sway 4s ease-in-out infinite; }
        .lantern.left  { left: 2%;  transform-origin: 50% 0; }
        .lantern.right { right: 2%; transform-origin: 50% 0; animation-delay: -2s; }
        @keyframes sway {
            0%, 100% { transform: rotate(-4deg); }
            50%      { transform: rotate(4deg); }
        }

        /* ---- 木札（見出し・ボタン共通） ---- */
        .fuda {
            color: var(--washi);
            border-radius: 10px;
            border: 2px solid rgba(0,0,0,.25);
            box-shadow: 0 4px 0 var(--wood-deep), 0 6px 10px rgba(0,0,0,.25);
            text-shadow: 0 2px 2px rgba(0,0,0,.35);
        }
        .fuda:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-deep); }

        /* =========================================================
         *  帯（学年えらび）
         * ========================================================= */
        .belt {
            position: relative;
            border-radius: 9px;
            padding: .8rem .35rem .95rem;
            background: var(--belt);
            color: var(--belt-ink);
            border: 2px solid rgba(0,0,0,.28);
            box-shadow: inset 0 -6px 10px rgba(0,0,0,.18), 0 3px 0 rgba(0,0,0,.2);
            transition: transform .12s ease, box-shadow .12s ease;
            line-height: 1.15;
        }
        .belt::after {           /* 帯のステッチ */
            content: '';
            position: absolute; inset: 5px 7px;
            border-radius: 5px;
            border: 1px dashed color-mix(in srgb, var(--belt-ink) 40%, transparent);
            pointer-events: none;
        }
        .belt .belt-grade { display: block; font-family: var(--font-impact); font-size: 1.15rem; }
        .belt .belt-name  { display: block; font-size: .68rem; opacity: .85; margin-top: .1rem; }
        .belt:active { transform: translateY(2px); }
        .belt[aria-pressed="true"] {
            transform: translateY(-3px) scale(1.04);
            box-shadow: inset 0 -6px 10px rgba(0,0,0,.18), 0 0 0 5px var(--kin), 0 8px 14px rgba(0,0,0,.3);
        }

        /* 選択マーク（帯・巻物で共通）。文字ではなく図形なので小さくても読める。 */
        .pick {
            position: absolute; top: -11px; right: -11px;
            z-index: 3;   /* 巻物の軸(::after)や帯のステッチより前に出す */
            width: 28px; height: 28px;
            display: none; align-items: center; justify-content: center;
            border-radius: 50%;
            background: var(--shu);
            color: #fff;
            border: 3px solid var(--washi);
            box-shadow: 0 2px 5px rgba(0,0,0,.35);
        }
        .pick svg { width: 15px; height: 15px; }
        [aria-pressed="true"] > .pick { display: flex; }
        /* 選択中のカードは隣のカードより前面に置く */
        .belt[aria-pressed="true"], .makimono[aria-pressed="true"] { z-index: 2; }

        /* =========================================================
         *  巻物（モードえらび）
         * ========================================================= */
        .makimono {
            position: relative;
            margin: 0 12px;
            padding: 1rem 1rem 1.1rem;
            text-align: left;
            background: linear-gradient(180deg, #fffaf0, var(--washi-deep));
            border-top: 2px solid rgba(139,90,43,.3);
            border-bottom: 2px solid rgba(139,90,43,.3);
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .makimono::before, .makimono::after {   /* 左右の軸 */
            content: '';
            position: absolute; top: -8px; bottom: -8px; width: 14px;
            border-radius: 7px;
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 2px, transparent 2px 9px),
                linear-gradient(90deg, var(--wood-light), var(--wood-deep));
            box-shadow: 0 2px 5px rgba(0,0,0,.35);
        }
        .makimono::before { left: -12px; }
        .makimono::after  { right: -12px; }
        .makimono:active { transform: translateY(2px); }
        .makimono[aria-pressed="true"] {
            box-shadow: 0 0 0 5px var(--kin), 0 8px 16px rgba(0,0,0,.22);
            transform: translateY(-3px);
        }
        .makimono .mode-head { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .55rem; }
        .makimono .mode-title { font-family: var(--font-brush); font-size: 1.5rem; color: var(--sumi); white-space: nowrap; letter-spacing: .08em; }
        .makimono .mode-sub {
            font-size: .72rem; font-weight: 700; color: var(--shu-deep);
            border: 1px solid var(--shu-deep); border-radius: 4px; padding: 0 .3rem;
            white-space: nowrap; flex: none;
        }
        .makimono .mode-desc { font-size: .8rem; color: var(--sumi-soft); margin-top: .35rem; line-height: 1.5; }
        .makimono .mode-hint {
            font-size: .72rem; font-weight: 700; color: var(--ai);
            margin-top: .45rem; border-top: 1px dashed rgba(0,0,0,.2); padding-top: .35rem;
        }
        .makimono .mode-icon { width: 26px; height: 26px; flex: none; }

        /* =========================================================
         *  クイズ画面
         * ========================================================= */
        .card-frame {
            padding: 11px;
            border-radius: 20px;
            box-shadow: 0 10px 22px rgba(0,0,0,.28), inset 0 0 0 2px rgba(0,0,0,.2);
        }

        #character-target-div {
            position: relative;
            width: var(--card);
            height: var(--card);
            margin: 0 auto;
            background-color: #fffdf7;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(139,90,43,.35);
            transition: transform 0.3s ease-out;
            touch-action: none; /* Apple Pencil の誤スクロール防止 */
        }

        #character-target-div.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            box-shadow: inset 0 0 0 3px var(--shu), 0 0 22px rgba(207,58,46,.55);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0); }
            40%, 60% { transform: translate3d(10px, 0, 0); }
        }

        .grid-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity 0.5s ease; }
        .grid-lines line { stroke: #d9c8a6; stroke-width: 2; stroke-dasharray: 8 8; }

        #hanzi-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; border-radius: 12px; overflow: hidden; }

        /* 学年バッジ＝帯色の木札 */
        #grade-label-badge {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            z-index: 20; white-space: nowrap;
            padding: .3rem 1.1rem;
            font-size: .8rem; font-weight: 700;
            background: var(--belt, var(--kin));
            color: var(--belt-ink, #3a2b05);
            border: 2px solid rgba(0,0,0,.3);
            border-radius: 7px;
            box-shadow: 0 3px 0 rgba(0,0,0,.25);
        }

        /* 進捗＝15個の判子マス */
        /* 進捗＝15個の判子マス。正解したマスは朱で塗りつぶし、白いチェックを捺す。 */
        .stamp {
            width: 1.8rem; height: 1.8rem;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(91,81,71,.4);
            border-radius: 5px;
            background: rgba(255,255,255,.6);
        }
        .stamp svg { width: 1.1rem; height: 1.1rem; display: none; }
        .stamp.done {
            border-color: var(--shu-deep);
            background: var(--shu);
            color: #fff;
            animation: stampIn .35s cubic-bezier(.2,1.6,.4,1) both;
        }
        .stamp.done svg { display: block; }
        .stamp.now { box-shadow: 0 0 0 3px var(--kin); }
        @keyframes stampIn {
            0%   { transform: scale(2.2) rotate(-18deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* 気合いの一言（喝！／一本！） */
        .kiai {
            position: absolute; top: 42%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-brush);
            font-size: clamp(3rem, 14vw, 6rem);
            pointer-events: none; opacity: 0; z-index: 30;
            text-shadow: 0 4px 0 rgba(0,0,0,.25);
        }
        .kiai.show { animation: kiaiPop .9s ease-out both; }
        @keyframes kiaiPop {
            0%   { opacity: 0; transform: translate(-50%,-50%) scale(2.4) rotate(-14deg); }
            18%  { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-8deg); }
            70%  { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%,-56%) scale(1.05) rotate(-8deg); }
        }

        /* 読みパネル＝小さな巻物 */
        .yomi {
            position: relative;
            max-height: 8.5rem;   /* 読みが多い字でもナビに重ならないようにする保険 */
            overflow: hidden;
            margin-top: 1.5rem;
            padding: .85rem 1rem;
            background: linear-gradient(180deg, #fffaf0, var(--washi-deep));
            border-top: 2px solid rgba(139,90,43,.3);
            border-bottom: 2px solid rgba(139,90,43,.3);
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
            z-index: 20;
        }
        .yomi::before, .yomi::after {
            content: ''; position: absolute; top: -7px; bottom: -7px; width: 12px; border-radius: 6px;
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 2px, transparent 2px 9px),
                linear-gradient(90deg, var(--wood-light), var(--wood-deep));
            box-shadow: 0 2px 5px rgba(0,0,0,.3);
        }
        .yomi::before { left: -10px; }
        .yomi::after  { right: -10px; }
        .yomi-tag {
            flex: none; width: 2.4rem; text-align: center;
            font-family: var(--font-brush); font-size: 1rem;
            border-radius: 5px; padding: .1rem 0;
            color: var(--washi);
        }

        .particle { position: absolute; border-radius: 50%; pointer-events: none; animation: pop 0.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }
        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }

        @keyframes dropIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card-container { perspective: 1200px; }
        .card-enter { animation: cardEnter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateX(60px) rotateY(-15deg) scale(0.95); }
            to   { opacity: 1; transform: translateX(0) rotateY(0) scale(1); }
        }

        /* 免許皆伝の朱印 */
        @keyframes sealSlam {
            0%   { transform: rotate(-30deg) scale(4); opacity: 0; }
            55%  { transform: rotate(-12deg) scale(.92); opacity: 1; }
            75%  { transform: rotate(-12deg) scale(1.06); }
            100% { transform: rotate(-12deg) scale(1); opacity: 1; }
        }

        /* =========================================================
         *  漢字ずかん
         * ========================================================= */
        .shoji {
            background: #fffdf7;
            border: 3px solid var(--wood);
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0,0,0,.18);
        }
        /* 格子（障子）状に並べる。行が埋まらなくても余白が出ないよう、
           枠線はマス自身に持たせる（コンテナ背景で描かない）。 */
        .zukan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(3rem, 1fr)); gap: 0; }
        .zukan-cell {
            aspect-ratio: 1 / 1;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; line-height: 1;
            border: 1px solid rgba(139,90,43,.32);
        }
        /* まだ出題されていない漢字：うすいグレー */
        .zukan-cell.unseen { color: #aca496; background: #f7f4ec; }
        /* 出題されたことのある漢字：白地に黒でくっきり */
        .zukan-cell.seen   { color: #111111; background: #ffffff; }
        /* にがて（正解までのミス3回以上）は朱でかこむ */
        .zukan-cell.weak   { box-shadow: inset 0 0 0 3px var(--shu); }

        /* =========================================================
         *  よくあるしつもん（高札）
         * ========================================================= */
        .faq-item {
            background: #fffdf7;
            border: 2px solid rgba(139,90,43,.45);
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,.14);
            overflow: hidden;
        }
        .faq-q { width:100%; text-align:left; padding:.9rem 1.1rem; font-weight:700; color: var(--sumi); display:flex; gap:.7rem; align-items:flex-start; }
        .faq-a { padding:0 1.1rem 1.1rem 2.9rem; color: var(--sumi-soft); line-height:1.9; display:none; white-space:pre-wrap; }
        .faq-item.open .faq-a { display:block; }
        .faq-item.open .faq-mark { transform: rotate(45deg); }
        .faq-mark { transition: transform .2s ease; display:inline-block; color: var(--shu); font-size:1.3rem; line-height:1.2; }
        .faq-a strong { color: var(--sumi); }

        /* ---- このアプリについて（クレジット） ----
           Kids Category ではアプリ外へのリンクを parental gate の裏に置く必要があるため、
           URL はリンクにせずテキストで示す。ここだけは選択・コピーできるようにしておく。 */
        .credit-sec { padding: .85rem 0; border-top: 1px dashed rgba(139,90,43,.35); }
        .credit-sec:first-child { border-top: 0; padding-top: 0; }
        .credit-h { font-weight: 700; color: var(--sumi); font-size: .92rem; margin-bottom: .3rem; }
        .credit-p { font-size: .82rem; line-height: 1.85; color: var(--sumi-soft); }
        .credit-list { font-size: .8rem; line-height: 1.9; color: var(--sumi-soft); margin-top: .2rem; }
        .privacy-updated { font-size: .76rem; color: var(--sumi-soft); margin-top: .9rem; text-align: right; }
        .credit-url {
            /* リンクではないので、リンク色は使わない（押せそうに見せない） */
            display: block; font-size: .76rem; line-height: 1.7; color: var(--sumi-soft);
            word-break: break-all; margin-top: .15rem;
            user-select: text; -webkit-user-select: text;
        }
    </style>

    <!-- ビルド済み Tailwind（使っているクラスだけ）。cdn.tailwindcss.com の置き換え。
         CDN版は実行時にこの内容を生成して <style> を末尾へ差し込んでいたので、
         見た目を変えないために、ここ（ページ内 <style> のあと）に読み込む。 -->
    <link rel="stylesheet" href="assets/tailwind.css">
</head>
<body>

<!-- ===================== SVG スプライト（すべて自前・外部画像なし） ===================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

 * 永続データ（localStorage）

 * ===================================================================== */

const READINGS_KEY = 'suisui-readings-v2';

    try {
        const raw = localStorage.getItem(STORAGE_KEY);

            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object' && parsed.kanji) return parsed;
        }
    } catch (e) { /* 壊れていたら作り直す */ }
    return { version: 1, kanji: {} };
})();

function saveStore() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
    catch (e) { console.warn('保存に失敗しました', e); }
}

function recordOf(char) {
    return store.kanji[char] || (store.kanji[char] = { s: 0, m: 0, p: 0 });
}
function seenCount(char)     { const r = store.kanji[char]; return r ? (r.s || 0) : 0; }
function mistakeCount(char)  { const r = store.kanji[char]; return r ? (r.m || 0) : 0; }
function perfectStreak(char) { const r = store.kanji[char]; return r ? (r.p || 0) : 0; }
function isSeen(char)        { return seenCount(char) > 0; }
function isWeak(char)        { return mistakeCount(char) >= REVENGE_THRESHOLD; }

function markPresented(char) {
    const r = recordOf(char);
    r.s = (r.s || 0) + 1;
    saveStore();
}

function markCompleted(char, mistakes) {
    const r = recordOf(char);
    r.m = mistakes;                        // 最新セッションの値で上書き
    r.p = mistakes === 0 ? (r.p || 0) + 1 : 0;
    saveStore();
}

// 学年は「帯の色」で表す。白帯（1年）から黒帯（6年）、全学年は金帯。
const GRADE_OPTIONS = [
    { key: '1',   label: '1年',   belt: '白帯',   color: '#f4f1e6', ink: '#241f1b' },
    { key: '2',   label: '2年',   belt: '黄帯',   color: '#f2c53d', ink: '#4a3a10' },

    { key: 'all', label: '全学年', belt: '金帯',   color: '#d4a017', ink: '#3a2b05' }
];

// label が主（漢語）、sub が従（カタカナの言いかえ）。
const MODE_OPTIONS = [
    { key: 'normal',  label: '稽古', sub: 'ノーマル',     icon: 'i-scroll', desc: 'えらんだ学年からランダムに15もん。' },
    { key: 'revenge', label: '復習', sub: 'リベンジ',     icon: 'i-flame',  desc: 'まちがえやすい漢字を優先して15もん。' },
    { key: 'new',     label: '初見', sub: 'ニューフェイス', icon: 'i-spark',  desc: 'まだ出会っていない漢字を優先して15もん。' }
];

// 師匠のひとこと（モードごと）
const MASTER_LINES = {
    normal:  'よく来たな。きょうは どの帯に ちょうせんする？',
    revenge: 'にがてな字ほど、のびしろがあるものじゃ。',
    new:     'はじめての字との出会いは、たからものじゃぞ。'
};

function gradeOption(key) { return GRADE_OPTIONS.find(o => o.key === String(key)); }

let selectedGrade = 'all';
let selectedMode = 'normal';

function poolFor(gradeKey) {
    const grades = gradeKey === 'all' ? [1, 2, 3, 4, 5, 6] : [Number(gradeKey)];
    const pool = [];
    grades.forEach(g => GRADE_KANJI[g].forEach(char => pool.push({ char: char, grade: g })));
    return pool;
}

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

/**
 * 優先グループから先に詰め、足りない分を残りからランダムに補充する。
 * （例：該当が10字なら10字すべて＋残り5問を非該当から）
 */
function buildSession(gradeKey, mode) {
    const pool = poolFor(gradeKey);
    if (mode === 'normal') return shuffle(pool).slice(0, QUESTIONS_PER_SESSION);

    let priority, rest;
    if (mode === 'revenge') {
        priority = pool.filter(k => isWeak(k.char));
        rest     = pool.filter(k => !isWeak(k.char));
        // ミスの多い漢字ほど先に（同数はランダム）
        priority = shuffle(priority).sort((a, b) => mistakeCount(b.char) - mistakeCount(a.char));
    } else { // 'new'
        priority = shuffle(pool.filter(k => !isSeen(k.char)));
        rest     = pool.filter(k => isSeen(k.char));
    }

    const picked = priority.slice(0, QUESTIONS_PER_SESSION);
    if (picked.length < QUESTIONS_PER_SESSION) {
        picked.push(...shuffle(rest).slice(0, QUESTIONS_PER_SESSION - picked.length));
    }
    return shuffle(picked); // 出題順そのものはランダムにする
}

/* 対象学年のなかで「にがて」「みまだ」が何字あるかを数える（ホームの表示用） */
function poolSummary(gradeKey) {
    const pool = poolFor(gradeKey);
    let weak = 0, unseen = 0;
    pool.forEach(k => {
        if (isWeak(k.char)) weak++;
        if (!isSeen(k.char)) unseen++;
    });
    return { total: pool.length, weak: weak, unseen: unseen };
}

/* --- Web Audio API（最初のタップで初期化する） --- */
let audioCtx = null;
function ensureAudio() {
    if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

/* ホワイトノイズは使い回す（コンテキストごとに1本だけ作る） */
function getNoiseBuffer(ctx) {
    if (!ctx.__noiseBuffer) {
        const len = Math.floor(ctx.sampleRate * 0.4);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        ctx.__noiseBuffer = buf;
    }
    return ctx.__noiseBuffer;
}

/**
 * 「シャッ」＝刀を振り抜くような音。
 * ホワイトノイズのバンドパスを一気に上げてから落とすと、風を切る感じになる。
 * 立ち上がりを速く・余韻を短くするのが「シャッ」に聞こえるコツ。
 */
function buildSwish(ctx, destination, startTime, volume) {
    const dur = 0.16;
    const vol = (volume === undefined) ? 0.75 : volume;   // 他の効果音と音量感がそろう値

    const src = ctx.createBufferSource();
    src.buffer = getNoiseBuffer(ctx);

    const band = ctx.createBiquadFilter();
    band.type = 'bandpass';
    band.Q.value = 1.1;
    band.frequency.setValueAtTime(700, startTime);
    band.frequency.exponentialRampToValueAtTime(5200, startTime + dur * 0.4);
    band.frequency.exponentialRampToValueAtTime(1200, startTime + dur);

    const hp = ctx.createBiquadFilter();   // 低音を切って軽さを出す
    hp.type = 'highpass';
    hp.frequency.value = 500;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(vol, startTime + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0008, startTime + dur);

    src.connect(band);
    band.connect(hp);
    hp.connect(gain);
    gain.connect(destination);

    src.start(startTime);
    src.stop(startTime + dur + 0.02);
    return dur;
}

function playSound(type) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;

    if (type === 'stroke') {
        buildSwish(audioCtx, audioCtx.destination, now);

    } else if (type === 'success') {
        const frequencies = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        frequencies.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const time = now + (i * 0.08);
            osc.frequency.setValueAtTime(freq, time);
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.2, time + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(time); osc.stop(time + 0.5);
        });

    } else if (type === 'error') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.2);
    }
}

function showReadings(char) {
    const onEl = document.getElementById('on-readings');
    const kunEl = document.getElementById('kun-readings');

    // 同梱の読み（assets/readings.js）。1026字すべて入っているので通常はここで返る。
    // それでも無いときのために、localStorage のキャッシュと通信の経路は残してある。
    const bundled = (typeof KANJI_READINGS !== 'undefined') ? KANJI_READINGS[char] : null;
    const cached = bundled || readingsCache[char];
    if (cached) {
        onEl.textContent = cached.on;
        kunEl.textContent = cached.kun;
        return;
    }

    onEl.textContent = '...';
    kunEl.textContent = '...';

    fetch('https://kanjiapi.dev/v1/kanji/' + encodeURIComponent(char))
        .then(res => res.json())
        .then(data => {
            // 「ひと.しい」の送り仮名ドットと、「-うえ」「うわ-」の接辞ハイフンを落とし、
            // 重複をまとめてから上限件数で切る（切ったときは末尾に「ほか」）
            const tidy = (list, max) => {
                const uniq = list
                    .map(r => r.replace(/\./g, '').replace(/^-+|-+$/g, ''))
                    .filter(r => r.length > 0)
                    .filter((r, i, a) => a.indexOf(r) === i);
                if (uniq.length === 0) return '（なし）';
                return uniq.length > max
                    ? uniq.slice(0, max).join('、') + ' ほか'
                    : uniq.join('、');
            };
            const on = tidy(data.on_readings, MAX_ON_READINGS);
            const kun = tidy(data.kun_readings, MAX_KUN_READINGS);
            readingsCache[char] = { on: on, kun: kun };
            saveReadings();
            // 表示中の漢字が変わっていなければ反映
            if (sessionKanji[currentIndex] && sessionKanji[currentIndex].char === char) {
                onEl.textContent = on;
                kunEl.textContent = kun;
            }
        })
        .catch(err => {
            console.error('Failed to fetch kanji readings', err);
            if (sessionKanji[currentIndex] && sessionKanji[currentIndex].char === char) {
                onEl.textContent = '取得できませんでした';
                kunEl.textContent = '取得できませんでした';
            }
        });
}

function renderKanji(animateIn) {

    if (!currentItem) return;
    const char = currentItem.char;
    const targetDiv = document.getElementById('character-target-div');
    const hanziContainer = document.getElementById('hanzi-container');
    const badge = document.getElementById('grade-label-badge');

    // 「出題された」記録（漢字ずかん・あたらしい漢字モードで使用）
    markPresented(char);

    if (animateIn) {
        const card = document.getElementById('card');
        card.classList.remove('card-enter');
        void card.offsetWidth; // force reflow
        card.classList.add('card-enter');
    }

    document.getElementById('current-kanji-display').textContent = char;
    document.getElementById('current-index').textContent = currentIndex + 1;
    document.getElementById('total-kanji').textContent = sessionKanji.length;

    showReadings(char);
    renderProgress();

    // 学年バッジ＝その学年の帯色の木札。クリア済みなら朱の合格印に変わる。
    const belt = gradeOption(currentItem.grade);
    if (clearedIndices.has(currentIndex)) {
        badge.textContent = currentItem.grade + '年生で習う漢字 ・ 合格';
        badge.style.setProperty('--belt', '#cf3a2e');
        badge.style.setProperty('--belt-ink', '#ffffff');
    } else {
        badge.textContent = currentItem.grade + '年生で習う漢字（' + belt.belt + '）';
        badge.style.setProperty('--belt', belt.color);
        badge.style.setProperty('--belt-ink', belt.ink);
    }

    // 十字ガイド：ノーミス正解が続いている漢字では消す
    const gridLines = document.getElementById('grid-lines');
    gridLines.style.opacity = perfectStreak(char) >= GUIDE_HIDE_STREAK ? '0' : '1';

    hanziContainer.innerHTML = '';
    writer = HanziWriter.create('hanzi-container', char, {
        width: CARD_SIZE,
        height: CARD_SIZE,
        padding: Math.round(CARD_SIZE * 0.05),
        showOutline: true,
        strokeAnimationSpeed: 2,
        delayBetweenStrokes: 50,
        strokeColor: '#3B82F6',
        highlightColor: '#EF4444',
        outlineColor: '#E5E7EB',
        drawingWidth: 28,
        drawingColor: '#1E3A8A',
        charDataLoader: function (char, onLoad, onError) {
            fetch('https://cdn.jsdelivr.net/gh/mnako/hanzi-writer-data-ja@master/data/' + char + '.json')
                .then(res => { if (!res.ok) throw new Error(); return res.json(); })
                .then(onLoad)
                .catch(() => {
                    fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data-jp@0/' + char + '.json')
                        .then(res => { if (!res.ok) throw new Error(); return res.json(); })
                        .then(onLoad)
                        .catch(onError);
                });
        }
    });

    writer.quiz({
        onMistake: () => {
            playSound('error');
            showKiai('喝！', '#cf3a2e');
            targetDiv.classList.remove('shake');
            void targetDiv.offsetWidth;
            targetDiv.classList.add('shake');
            gridLines.style.opacity = '1';
        },
        onCorrectStroke: () => {
            playSound('stroke');
            targetDiv.classList.remove('shake');
        },
        onComplete: (summaryData) => {
            playSound('success');
            createParticles();
            showKiai(summaryData.totalMistakes === 0 ? '一本！' : '合', '#d4a017');

            // 正解までに受けた誤り判定の数を記録（最新セッションの値で上書き）
            markCompleted(char, summaryData.totalMistakes);

            clearedIndices.add(currentIndex);
            renderProgress();

            advanceTimer = setTimeout(() => {
                advanceTimer = null;
                if (currentView !== 'quiz') return;
                if (clearedIndices.size === sessionKanji.length && !isGameCleared) {
                    isGameCleared = true;
                    fireCrackers();
                } else if (!isGameCleared) {
                    // まだクリアしていない問題を探して遷移する
                    let nextIndex = currentIndex + 1;
                    while (nextIndex < sessionKanji.length && clearedIndices.has(nextIndex)) nextIndex++;
                    if (nextIndex >= sessionKanji.length) {
                        nextIndex = 0;
                        while (nextIndex < currentIndex && clearedIndices.has(nextIndex)) nextIndex++;
                    }
                    currentIndex = nextIndex;
                    renderKanji(true);
                }
            }, 1500);
        }
    });
}

/* =====================================================================
 * 漢字ずかん
 * ===================================================================== */
function buildZukan() {
    const body = document.getElementById('zukan-body');
    body.innerHTML = '';

    let totalSeen = 0, total = 0;

    for (let g = 1; g <= 6; g++) {
        const chars = GRADE_KANJI[g];
        const seen = chars.filter(isSeen).length;
        totalSeen += seen;
        total += chars.length;

        const belt = gradeOption(g);
        const section = document.createElement('section');
        section.className = 'shoji p-4';

        const head = document.createElement('div');
        head.className = 'flex items-center justify-between mb-3';
        head.innerHTML =
            '<h2 class="brush text-lg px-3 py-0.5 rounded" ' +
                'style="background:' + belt.color + ';color:' + belt.ink + ';border:2px solid rgba(0,0,0,.28)">' +
                g + '年生 ・ ' + belt.belt + '</h2>' +
            '<p class="impact text-sm" style="color:var(--sumi-soft)">' + seen + ' / ' + chars.length + '</p>';
        section.appendChild(head);

        const grid = document.createElement('div');
        grid.className = 'zukan-grid';
        chars.forEach(char => {
            const cell = document.createElement('div');
            cell.className = 'zukan-cell kanji-font ' + (isSeen(char) ? 'seen' : 'unseen');
            if (isSeen(char) && isWeak(char)) cell.classList.add('weak');
            cell.textContent = char;
            grid.appendChild(cell);
        });
        section.appendChild(grid);
        body.appendChild(section);
    }

    document.getElementById('zukan-total-seen').textContent = totalSeen;
    document.getElementById('zukan-total-bar').style.width = ((totalSeen / total) * 100) + '%';
}


function buildPrivacy() {
    const items = PRIVACY.slice();
    if (PRIVACY_CONTACT) {
        items.push({ h: 'お問い合わせ', p: PRIVACY_CONTACT });
    }
    const body = document.getElementById('privacy-body');
    body.innerHTML = '';
    renderSections(body, items);

    const upd = document.createElement('p');
    upd.className = 'privacy-updated';
    upd.textContent = '最終更新：' + PRIVACY_UPDATED;
    body.appendChild(upd);
}

/* クレジット欄とプライバシー欄で共通の描画処理 */
function renderSections(body, sections) {
    sections.forEach(c => {
        const sec = document.createElement('section');
        sec.className = 'credit-sec';

        const h = document.createElement('div');
        h.className = 'credit-h';
        h.textContent = c.h;
        sec.appendChild(h);

        if (c.p) {
            const p = document.createElement('p');
            p.className = 'credit-p';
            p.textContent = c.p;
            sec.appendChild(p);
        }
        if (c.list) {
            const ul = document.createElement('div');
            ul.className = 'credit-list';
            c.list.forEach(line => {
                const d = document.createElement('div');
                d.textContent = '・' + line;
                ul.appendChild(d);
            });
            sec.appendChild(ul);
        }
        if (c.note) {
            const n = document.createElement('p');
            n.className = 'credit-p';
            n.style.marginTop = '.35rem';
            n.textContent = c.note;
            sec.appendChild(n);
        }
        (c.urls || []).forEach(u => {
            const s = document.createElement('span');
            s.className = 'credit-url';
            s.textContent = u;
            sec.appendChild(s);
        });

        body.appendChild(sec);
    });
}

function buildCredits() {
    const body = document.getElementById('credits-body');
    body.innerHTML = '';
    renderSections(body, CREDITS);
}

function buildFaq() {
    document.getElementById('faq-intro').textContent = FAQ_INTRO; // リード文はプレーンテキスト

    const body = document.getElementById('faq-body');
    body.innerHTML = '';
    FAQ_ITEMS.forEach(item => {
        const wrap = document.createElement('div');
        wrap.className = 'faq-item';

        const btn = document.createElement('button');
        btn.className = 'faq-q';
        btn.innerHTML = '<span class="faq-mark">＋</span><span class="flex-1">' + item.q + '</span>';
        btn.addEventListener('click', () => wrap.classList.toggle('open'));

        const ans = document.createElement('div');
        ans.className = 'faq-a';
        ans.innerHTML = item.a; // 本文はアプリ内で定義した固定文字列のみ

        wrap.appendChild(btn);
        wrap.appendChild(ans);
        body.appendChild(wrap);
    });
}

/* =====================================================================
 * 起動処理
 * ===================================================================== */
// お手本カードのサイズを端末に合わせて決める（起動時に一度だけ）
const CARD_SIZE = Math.max(
    250,
    Math.min(400, window.innerWidth - 76, window.innerHeight - 386)
);
document.documentElement.style.setProperty('--card', CARD_SIZE + 'px');

buildHome();
buildFaq();
buildCredits();
buildPrivacy();
refreshHome();

// 最初のタップで音声を有効化する（iOS/iPadOS の制限対応）
document.addEventListener('pointerdown', ensureAudio, { once: true });

document.getElementById('btn-start').addEventListener('click', () => {
    ensureAudio();
    startSession();
});

document.getElementById('btn-home').addEventListener('click', quitSession);

document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => showView(btn.dataset.nav));
});

document.getElementById('btn-prev').addEventListener('click', () => {
    if (currentIndex > 0) { currentIndex--; renderKanji(true); }
});

document.getElementById('btn-next').addEventListener('click', () => {
    if (currentIndex < sessionKanji.length - 1) { currentIndex++; renderKanji(true); }
});

</script>
